[project]
name = "berg-plugin-shared-todo"
version = "0.0.1"
description = "Shared ToDo lists and planning for Berg Agents"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "agpl-3.0.txt"]
authors = [{ name = "Berg Agents Team", email = "team@berg-agents.dev" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = []

#  berg-agents==0.1.0 (from file:///home/sofiabillberg/code-projects/berg-agents)

[project.entry-points."berg_plugins"]
shared_todo = "shared_todo.shared_todo:SharedToDoPlugin"

[project.optional-dependencies]
tests = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0"]

[dependency-groups]
dev = [
    "pip>=26.2.2",
    "uv"]
plugin-deps = [
    "berg-agents",
    "dotenv>=0.9.9",
    "httpx>=0.27.0",
    "pydantic-settings>=2.15.0",
    # "berg-agents"]

[build-system]
requires = ["uv-build>=0.11.26,<0.22"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "if-necessary"
package = true
# default-groups = ["dev", "plugin-deps"] # "tests"]

# preview-features=["format-command", "audit-command", "check-command", "index-by-name", "tool-install-locks"]

preview = true  # ["format-command", "audit-command", "check-command", "index-by-name", "tool-install-locks"]

[tool.uv.build-backend]
module-root = ""
module-name = ["shared_todo"]
namespace = true
source-exclude = [
    "**/*.bin",
    ".*/*",
    "**/dist",
    "**/build",
    "**/_build",
    ".venv",
    "**/node_modules",
    "**/archive",
    "**/*cache*",
    "**/support-libs",
    "**/.next/**",
    "**/.ipynb_checkpoints/**",
    "tmp/**",
    "feat_dev/**",
    "berg_plugins/**",
    "suggestions/**",
    "_site/**"]

[tool.uv.sources]
berg-agents = { path = "/home/sofiabillberg/code-projects/berg-agents" }
# berg-agents = { path = "/home/sofiabillberg/code-projects/berg-agents/dist/berg_agents-0.1.0.tar.gz" }
