# Shared ToDo Plugin for Berg-Agents
# === Identity (Required) ===
id: "berg-plugin-shared-todo"
version: "0.0.1"
name: "Shared ToDo"

# === Description (Required) ===
description: |
  Collaborative planning and todo list for user-agent development. This plugin enables user and agent to create, 
  review and edit todo-lists and plans both interactively and independently.
  It provides a shared tool where an agent can propose a plan and todo-list that also the user can edit and change 
  as needed. ToDo-lists and plans are saved as markdown documents in sharedtodo directory.

# === Metadata (Optional) ===
author:
  name: "Sofia Billger Bergström"
  email: "you@example.com"
  url: "https://example.com"

license: "AGPL"

homepage: "https://github.com/org/berg-plugin-shared-todo"
repository: "https://github.com/org/berg-plugin-shared-todo"

tags:
  - "todo"
  - "planning"
  - "productivity"

icon: "📋"

# === Entry Point (Required) ===
entry_point: "shared-todo:SharedToDoPlugin"

# === Requirements (Optional) ===
requirements:
  python: ">=3.10"
  berg_agents: ">=0.0.1 <1.0.0"

# === Dependencies (Optional) ===
dependencies: []

# === Capabilities (Optional) ===
capabilities:
  - type: tool
    id: "shared-todo"
    name: "Shared ToDo"
    description: "Manage shared todo lists"
    tools:
      - "create_todo"
      - "list_todos"
      - "update_todo"
      - "complete_todo"
    risk_level: "low"

# === Settings Schema (Optional) ===
settings_schema:
  type: object
  properties:
    todo_path:
      type: string
      description: "Path to directory to use for todo-lists"
      default: "./sharedtodos/"
      secret: false
      required: false

# === Permissions (Optional) ===
permissions:
  - filesystem:read
  - filesystem:write

# === Lifecycle (Optional) ===
lifecycle:
  auto_enable: false
  deferred: true
  priority: 100
