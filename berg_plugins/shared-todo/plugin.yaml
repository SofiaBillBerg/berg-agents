# Shared ToDo Plugin for Berg-Agents
# === Identity (Required) ===
id: "berg-plugin-shared-todo"
version: "0.0.1"
name: "Shared ToDo"

# === Description (Required) ===
description: |
  Collaborative planning and todo list for user-agent development. This plugin enables user and agent to create, 
  review and edit todo-lists and plans both interactively and independently.
  It provides a shared tool where an agent can propose a plan and todo-list that also the user can edit and change 
  as needed. ToDo-lists and plans are saved as markdown documents in sharedtodo directory.

# === Metadata (Optional) ===
author:
  name: "Sofia Billger Bergström"
  email: "you@example.com"
  url: "https://example.com"

license: "AGPL-3.0-only"

homepage: "https://github.com/org/berg-plugin-shared-todo"
repository: "https://github.com/org/berg-plugin-shared-todo"

tags:
  - "todo"
  - "planning"
  - "productivity"

icon: "📋"

# === Entry Point (Required) ===
# NOTE: Must be an importable module path (no hyphens).
entry_point: "shared_todo.shared_todo:SharedToDoPlugin"

# === Requirements (Optional) ===
requirements:
  python: ">=3.10"
  berg_agents: ">=0.0.1 <1.0.0"

# === Dependencies (Optional) ===
dependencies: []

# === Capabilities (Optional) ===
capabilities:
  - type: tool
    id: "shared-todo"
    name: "Shared ToDo"
    description: "Manage shared todo lists"
    tools:
      - "create_todo"
      - "list_todos"
      - "update_todo"
      - "complete_todo"
      - "delete_todo"
      - "add_subtask"
      - "set_subtask_done"
      - "rename_subtask"
      - "delete_subtask"
    risk_level: "low"

# === Settings Schema (Optional) ===
settings_schema:
  type: object
  properties:
    todo_path:
      type: string
      description: "Path to directory to use for todo-lists"
      default: "./sharedtodos/"
      secret: false

# === Per-session storage ===
# The plan belongs to one conversation, not to the process. Every tool
# below takes `todo_path`; declaring it here makes the plugin system bind
# that argument to
#   ~/.berg-agents/projects/<project-id>/todos/<session-key>/
# and drop it from the model-visible schema, so a model cannot redirect
# the store and two sessions keep different plans.
session_scope:
  parameter: "todo_path"
  subdir: "todos"
  default_key: "_default"

# === Which agents may use these tools ===
# Planning is shared work: the planner authors the plan, the chat agent
# discusses it with the user, and an implementer works it. Every one of
# them reads and writes the same list, which is the point.
toolset:
  roles:
    - "chat"
    - "planner"
    - "implementer"

# === Permissions (Optional) ===
permissions:
  - filesystem:read
  - filesystem:write

# === UI Surface (Optional) ===
# Declares that this plugin ships its own UI component. The host
# renders whatever the manifest names, and never knows the plugin's
# domain (see berg_plugins/shared-todo/ui/).
ui:
  # Built JS bundle (relative to the manifest), served by the host at
  # /berg-plugins/<plugin-dir>/ui/dist/todo-surface.js. The browser
  # runtime-imports this — the host never imports plugin source.
  entry: "ui/dist/todo-surface.js"
  # Named export the host mounts from that bundle.
  export: "TodoSurface"
  # Where the host offers it: "side-panel" (docked) or "canvas".
  placement: "side-panel"
  # Chrome in the host tool bar.
  label: "📋 Todos"
  # Panel width in the docked view.
  width: 340

# === Lifecycle (Optional) ===
lifecycle:
  auto_enable: false
  deferred: true
  priority: 100
