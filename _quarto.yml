language:
  search-text-placeholder: Search
project:
  resources:
    - _site/search-index.json
    - _site/docs/404.html
  type: website

  output-dir: _site
  pre-render:
    - "project_utils/run_apidocs.sh"
    - "project_utils/run_diagrams.sh"
  render:
    - "docs/**/*.qmd"
    - "!pdf_docs/*.qmd"
    - "!.*/*.*"
    - "!notes/*.*"
    - "!apidocs/**/*.*"
  post-render:
    - "project_utils/render_readme.sh"
website:
  title: "Berg Agents"
  back-to-top-navigation: true
  llms-txt: true
  page-navigation: true
  search:
    keyboard-shortcut: ["?", "H"]
    copy-button: true
    type: textbox
  favicon: docs/styles/logo/favicon.png
  image: docs/styles/logo/favicon.png
  margin-header: |
    ![Berg Agents Logo](docs/styles/logo/favicon.png)

  navbar:
    logo: docs/styles/logo/favicon.png
    logo-alt: "Berg Agents Logo"
    logo-href: docs/README.qmd
    left:
      - text: "Home"
        href: docs/README.qmd
      - text: "API Reference"
        href: docs/API.qmd
      - text: "Guides"
        href: docs/USAGE.qmd
      - text: "Community"
        href: docs/CONTRIBUTING.qmd
    right:
      - icon: github
        href: "https://github.com/SofiaBillBerg/berg-agents"
        text: "GitHub"
  sidebar:
    - title: "Introduction"
      style: "docked"
      contents:
        - text: "Quick Start"
          href: docs/QUICKSTART.qmd
        - text: "Cheat Sheet"
          href: docs/CHEATSHEET.qmd
    - title: "Guides"
      contents:
        - text: "Example Usage"
          href: docs/USAGE.qmd
        - text: "Plugin UI"
          href: docs/plugins/PLUGIN-UI.qmd
        - text: "Shared-ToDo pilot"
          href: docs/plugins/SHARED-TODO.qmd
        - text: "Manifest reference"
          href: docs/plugins/MANIFEST.qmd
        - text: "Memory & Compaction"
          href: docs/MEMORY.qmd
        - text: "Tools"
          href: docs/TOOLS.qmd
        - text: "Configuration"
          href: docs/CONFIGURATION.qmd
    - title: "Tutorials"
      contents:
        - text: "Adding a Custom Agent"
          href: docs/tutorials/quickstart_agents.qmd
        - text: "Multi-step Harness Workflow"
          href: docs/tutorials/harness_workflow.qmd
        - text: "Adding an MCP Server"
          href: docs/tutorials/mcp_integration.qmd
        - text: "Human-in-the-Loop"
          href: docs/tutorials/hilt_lifecycle.qmd
        - text: "Calling Tools Directly"
          href: docs/tutorials/advanced_tools.qmd

    - title: "Reference"
      contents:
        - text: "API Reference Overview"
          href: docs/API.qmd
        - text: "API Reference"
          href: apidocs/apidocs-help.html
    - title: "Community"
      contents:
        - text: "Contributing"
          href: docs/CONTRIBUTING.qmd
        - text: "News & Changelog"
          href: docs/CHANGELOG.qmd
        - text: "FAQ & Troubleshooting"
          href: docs/FAQ.qmd
  #    - title: "Tutorials"
  #      contents:
  #        - text: "Tutorials Overview"
  #          href: docs/TUTORIALS.qmd
  #        - text: "Quickstart Agents"
  #          href: docs/tutorials/quickstart_agents.qmd
  #        - text: "MCP Integration"
  #          href: docs/tutorials/mcp_integration.qmd
  #        - text: "Human-in-the-loop"
  #          href: docs/tutorials/hilt_lifecycle.qmd
  #        - text: "Harness Workflow"
  #          href: docs/tutorials/harness_workflow.qmd
  #        - text: "Advanced Tools"
  #          href: docs/tutorials/advanced_tools.qmd
  page-footer:
    right:
      - text: "License"
        href: agpl-3.0.md

format:
  html:
    theme:
      - docs/styles/custom.css
    css:
      - docs/styles/quartz-contrast.css
      - docs/styles/dt-wrap.css
    author: "Sofia Billger Bergström"
    cache: true
    citations-hover: true
    code-annotations: select
    code-copy: true
    code-fold: true
    code-links: true
    code-overflow: wrap
    code-summary: "Show/Hide Code"
    code-tools: true
    date-format: "iso"
    date-modified: last-modified
    date: "2025-11-02"
    description: "Berg Agents is a sophisticated multi-agent system built with a modular, extensible architecture."
    embed-resources: true
    fig-cap-location: bottom
    fig-env: figure
    fig-format: svg
    fig-responsive: true
    highlight-style: pygments
    includesource: true
    lightbox: true
    search: true
    # self-contained: true
    subtitle: "Documentation for The Berg-Agents - A local, LLM-driven code assistant with a **framework-agnostic core** and provider-centric configuration."
    tbl-cap-location: top
    toc-depth: 3
    toc-title: "On this page"
    toc: true
    touch: true
    wrap: auto
    resource-path:
      - LICENSE
      - docs/styles/logo/favicon.png
      - docs/visualizations/
#  - apidocs/09

filters:
  - include-code-files
  - inline-svg
  - lua-env
  - linkrot
  - preview-colour

extensions:
  badge:
    - key: BergAgents
      colour: orchid
      icon: chat-right-quote-fill
    - key: experimental
      colour: lime
      icon: flask
    - key: deprecated
      colour: gray
      icon: archive-fill
    - key: docs
      colour: rebeccapurple
      href: docs/README.qmd
      icon: icon
      target: _self
  linkrot:
    fail-on-error: false # Set to true to fail the build if broken links are found
    timeout: 10 # Timeout in seconds for each URL check
    user-agent: "Quarto-Linkrot/1.0" # User agent string for requests
    cache-results: true # Cache results to avoid checking the same URL multiple times
    debug: true # Enable debug logging
    output-file: "linkrot-report.txt" # Write results to a file (e.g., "linkrot-report.txt")
    skip-patterns: # List of regex patterns to skip
      - "example\\.com"
      - "localhost"
      - "0.0.0.0"
  preview-colour:
    code: true
    text: true
