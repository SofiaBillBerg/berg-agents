[project]
name = "plugin-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sofia Billger Bergström", email = "sofia.billger@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "berg-agents"]

[project.scripts]
#plugin-system = "plugin_system:src"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "plugin_system"
namespace = false
source-exclude = ["**/*.bin", ".*/*", "**/dist",
    "**/build", "**/_build", ".venv", "**/node_modules",
    "**/archive", "**/*cache*", "**/support-libs", "**/.next/**",
    "**/.ipynb_checkpoints/**", "tmp/**", "feat_dev/**", "berg_plugins/**",
    "suggestions/**", "_site/**"]

[tool.uv.sources]
berg-agents = { workspace = true }
