[project]
name = "berg-plugin-shared-todo"
version = "0.0.1"
description = "Shared ToDo lists and planning for Berg Agents"
authors = [
    {name = "Berg Agents Team", email = "team@berg-agents.dev"}
]
license = {text = "AGPL"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "berg-agents>=0.0.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0"]

[project.entry-points."berg_plugins"]
github = "shared_todo:SharedToDoPlugin"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]