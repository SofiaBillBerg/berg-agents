exclude: "^packrat(/|$)" # Exclude the packrat folder

repos:
  - repo: local
    hooks:
      - id: run-autofix
        name: run-autofix
        entry: project_utils/run_autofix.sh
        language: script
        stages: [pre-commit, manual]

      - id: quarto-render
        name: quarto-render
        entry: quarto render
        language: unsupported
        pass_filenames: false
        stages: [pre-push, manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: debug-statements
      - id: check-toml
      - id: check-ast
      - id: destroyed-symlinks
      - id: sort-simple-yaml
  - repo: https://github.com/asottile/setup-cfg-fmt
    rev: v3.2.0
    hooks:
      - id: setup-cfg-fmt
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py312-plus]
  - repo: https://github.com/posit-dev/air-pre-commit
    # Air version
    rev: 0.12.0
    hooks:
      - id: air-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.84
    hooks:
      - id: ty
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v3.4.0 # Use the latest version
    hooks:
      - id: panache-format # Format files
      - id: panache-lint # Lint and auto-fix issues
